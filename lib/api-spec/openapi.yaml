        visibility: { type: [number, "null"] }
        score: { type: [number, "null"] }
        citationRate: { type: [number, "null"] }
        recommendationRate: { type: [number, "null"] }
        cohortShare: { type: [number, "null"] }
        cohortMentions: { type: integer }
        meanPosition: { type: [number, "null"] }
        state: { type: string }
