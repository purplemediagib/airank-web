        brandNames: { type: array, items: { type: string } }
        id: { type: string }
        runId: { type: string }
        promptId: { type: string }
        promptVersion: { type: integer }
        text: { type: string }
        answer: { type: string }
        provider: { type: string }
        model: { type: [string, "null"] }
        collection: { $ref: "#/components/schemas/CollectionEvidence" }
        measurementSurface: { type: string }
        collectionMethod: { type: string }
        metricVersion: { type: string }
        observation: { $ref: "#/components/schemas/ApiObservation" }
        status: { type: string }
        observedAt: { type: number }
        mentioned: { type: boolean }
