        brandOrder: { $ref: "#/components/schemas/BrandOrderEvidence" }
        id: { type: string }
        runId: { type: string }
        promptId: { type: string }
        promptVersion: { type: [integer, "null"] }
        text: { type: string }
        provider: { type: string }
        model: { type: [string, "null"] }
        status: { type: string }
        answer: { type: [string, "null"] }
        citations: { type: array, items: { $ref: "#/components/schemas/ResultCitation" } }
        observedAt: { type: [number, "null"] }
        state: { type: string }
        taskStatus: { type: [string, "null"] }
        runCreatedAt: { type: [number, "null"] }
        topic: { type: [string, "null"] }
        language: { type: [string, "null"] }
        market: { type: [string, "null"] }
        metricsEligible: { type: boolean }
        collection: { $ref: "#/components/schemas/CollectionEvidence" }
        meta: { $ref: "#/components/schemas/EvidenceDiagnostics" }
        measurementSurface: { type: string }
        collectionMethod: { type: string }
        metricVersion: { type: string }
        observation: { $ref: "#/components/schemas/ApiObservation" }
        mentioned: { type: [boolean, "null"] }
        ownedCitation: { type: [boolean, "null"] }
        recommendation: { type: [string, "null"] }
        position: { type: [number, "null"] }
        exclusion: { type: [string, "null"] }
        sentimentAnalysis: { $ref: "#/components/schemas/SentimentAnalysis" }
        sentiment: { $ref: "#/components/schemas/BrandSentiment" }
