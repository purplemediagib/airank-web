    ResultPage:
      type: object
      required: [items, total, page, pageSize, hasMore]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ResultItem" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        hasMore: { type: boolean }
    SentimentBackfillInput:
      type: object
