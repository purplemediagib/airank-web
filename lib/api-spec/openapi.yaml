openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /airank/v1/projects/{projectId}/connections/{service}: { $ref: "./google-connections.yaml#/paths/connection" }
  /airank/v1/projects/{projectId}/connections/{service}/connect: { $ref: "./google-connections.yaml#/paths/connect" }
  /airank/v1/projects/{projectId}/connections/{service}/properties: { $ref: "./google-connections.yaml#/paths/properties" }
  /airank/v1/projects/{projectId}/connections/{service}/selection: { $ref: "./google-connections.yaml#/paths/selection" }
  /airank/v1/projects/{projectId}/connections/{service}/sync: { $ref: "./google-connections.yaml#/paths/sync" }
  /airank/v1/projects/{projectId}/connections/{service}/reports: { $ref: "./google-connections.yaml#/paths/reports" }
  /public-check/v1/capabilities: { $ref: "./public-check.yaml#/paths/capabilities" }
  /public-check/v1/prepare: { $ref: "./public-check.yaml#/paths/prepare" }
  /public-check/v1/preview: { $ref: "./public-check.yaml#/paths/preview" }
  /public-check/v1/scans: { $ref: "./public-check.yaml#/paths/scans" }
  /public-check/v1/scans/{scanId}: { $ref: "./public-check.yaml#/paths/scan" }
  /public-check/v1/scans/{scanId}/email: { $ref: "./public-check.yaml#/paths/email" }
  /public-check/v1/deliveries/{requestId}: { $ref: "./public-check.yaml#/paths/delivery" }
  /public-check/v1/reports/{token}: { $ref: "./public-check.yaml#/paths/report" }
  /airank/v1/industries:
    get:
      operationId: listIndustries
      responses:
        "200":
          description: Benchmark directory; admin flag is decided only by the server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndustryDirectory" }
    post:
      operationId: applyIndustryAction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndustryActionInput" }
      responses:
        "200":
          description: Admin-only action result (403 for non-admins)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndustryDirectory" }
  /airank/v1/industries/{industryId}:
    parameters:
      - { name: industryId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getIndustry
      responses:
        "200":
          description: Selected industry with latest report per panel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndustryDirectory" }
  /airank/v1/projects/{projectId}/schedule:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProjectSchedule
      responses:
        "200":
          description: Project monitoring schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectSchedule" }
    patch:
      operationId: updateProjectSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectScheduleInput" }
      responses:
        "200":
          description: Updated schedule; 409 on stale version, 503 when scheduler not enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectSchedule" }
  /airank/v1/projects/{projectId}/opportunities:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listOpportunities
      responses:
        "200":
          description: Owned evidence-backed opportunities
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Opportunity" } }
    post:
      operationId: refreshOpportunities
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpportunityRefreshInput" }
      responses:
        "200":
          description: Deterministic rule refresh from stored analytics; no paid calls
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Opportunity" } }
  /airank/v1/projects/{projectId}/opportunities/{opportunityId}:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: opportunityId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateOpportunity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpportunityUpdateInput" }
      responses:
        "200":
          description: Updated opportunity; 409 on stale version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Opportunity" }
  /airank/v1/projects/{projectId}/reports:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listReports
      responses:
        "200":
          description: Owned report snapshots (metadata only)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ReportSummary" } }
    post:
      operationId: createReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportInput" }
      responses:
        "201":
          description: Immutable persisted snapshot of all matching stored data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDetail" }
  /airank/v1/projects/{projectId}/reports/{reportId}:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: reportId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getReport
      responses:
        "200":
          description: Owned snapshot; 410 when expired (30 days)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDetail" }
  /airank/v1/projects/{projectId}/measurement-settings:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getMeasurementSettings
      responses:
        "200":
          description: Provider selection for future monitoring snapshots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeasurementSettings" }
    patch:
      operationId: updateMeasurementSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeasurementSettingsInput" }
      responses:
        "200":
          description: Updated selection; 409 on stale version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeasurementSettings" }
  /airank/v1/projects/{projectId}/research:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProjectResearch
      responses:
        "200":
          description: Competitor cohort, read-only discovered candidates, cited sources and linked evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Research" }
    post:
      operationId: applyResearchAction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResearchInput" }
      responses:
        "200":
          description: Persisted cohort decision; 409 when expectedVersion is stale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Research" }
  /airank/v1/projects/{projectId}/evidence/{evidenceId}:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: evidenceId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getEvidenceDetail
      responses:
        "200":
          description: Owned observation with redacted immutable stored envelope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceDetail" }
  /airank/v1/projects/{projectId}/results:
    get:
      operationId: listProjectResults
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: runId, in: query, schema: { type: string } }
        - { name: promptId, in: query, schema: { type: string } }
        - { name: provider, in: query, schema: { type: string } }
        - { name: topic, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: group, in: query, description: "Exact analytics composition group, or latest to resolve the default compatible group using the same measurement filters. Restricts exact selected task IDs, including unfinished tasks, before totals and pagination.", schema: { type: string } }
        - { name: tag, in: query, schema: { type: string, maxLength: 40 } }
        - { name: tags, in: query, description: "JSON-encoded array of up to 12 nonblank tag strings (40 characters each). Combined with legacy tag; matching uses frozen prompt tags.", schema: { type: string, maxLength: 1024 } }
        - { name: tagMode, in: query, schema: { type: string, enum: [and, or], default: or } }
        - { name: market, in: query, description: Frozen run market, schema: { type: string, pattern: "^[A-Z]{2}$" } }
        - { name: language, in: query, description: Frozen run language independent of market, schema: { type: string, pattern: "^[a-z]{2}$" } }
        - { name: surface, in: query, schema: { type: string } }
        - { name: promptVersion, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Owned paginated saved observations and unfinished monitoring tasks (0.11.0)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResultPage" }
  /airank/v1/projects/{projectId}/results/{evidenceId}:
    get:
      operationId: getProjectResult
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: evidenceId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: One owned observation/task returned directly (no wrapper)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResultItem" }
  /airank/v1/projects/{projectId}/sentiment-backfill:
    post:
      operationId: requestSentimentBackfill
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SentimentBackfillInput" }
      responses:
        "200":
          description: Explicit paid sentiment queueing for an existing run; existing jobs never repeated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentimentBackfillResult" }
  /airank/v1/projects/{projectId}/intelligence:
    post:
      operationId: updateProjectIntelligence
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntelligenceInput" }
      responses:
        "200":
          description: Review updated or saved answers queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntelligenceMutation" }
  /airank/v1/projects/{projectId}/analytics:
    get:
      operationId: getProjectAnalytics
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: provider, in: query, schema: { type: string } }
        - { name: topic, in: query, schema: { type: string } }
        - { name: group, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: tags, in: query, description: "JSON-encoded array of up to 12 nonblank tag strings (40 characters each). Combined with legacy tag; same matching applies to current and prior periods, evidence and all aggregates.", schema: { type: string, maxLength: 1024 } }
        - { name: tagMode, in: query, schema: { type: string, enum: [and, or], default: or } }
        - { name: market, in: query, description: Frozen run market, schema: { type: string, pattern: "^[A-Z]{2}$" } }
        - { name: language, in: query, description: Frozen run language independent of market, schema: { type: string, pattern: "^[a-z]{2}$" } }
        - { name: surface, in: query, schema: { type: string } }
        - { name: runId, in: query, schema: { type: string } }
        - { name: promptId, in: query, schema: { type: string } }
        - { name: promptVersion, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Complete-dataset owned monitoring analytics; incompatible groups never combined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectAnalytics" }
  /airank/v1/projects/{projectId}/prompts:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listTrackedPrompts
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: topic, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: provider, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Owned filtered prompt page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedPromptPage" }
    post:
      operationId: createTrackedPrompt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrackedPromptInput" }
      responses:
        "201":
          description: Created prompt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedPrompt" }
  /airank/v1/projects/{projectId}/prompts/{promptId}:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: promptId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getTrackedPrompt
      responses:
        "200":
          description: Immutable versions and measurement history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedPromptDetail" }
    patch:
      operationId: updateTrackedPrompt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrackedPromptUpdate" }
      responses:
        "200":
          description: New version including archive or restore
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedPrompt" }
  /airank/v1/projects/{projectId}/suggestions:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listPromptSuggestions
      responses:
        "200":
          description: Persisted context-aware reviewed drafts; no generation on reads
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PromptSuggestion" } }
    post:
      operationId: generatePromptSuggestions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyCommand" }
      responses:
        "200":
          description: Persisted deduplicated suggestions, no monitoring started
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PromptSuggestion" } }
  /airank/v1/projects/{projectId}/suggestions/{suggestionId}:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: suggestionId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: editPromptSuggestion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuggestionEdit" }
      responses:
        "200":
          description: Persisted pending draft edits; accepted/rejected drafts are immutable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromptSuggestion" }
    post:
      operationId: reviewPromptSuggestion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuggestionDecision" }
      responses:
        "200":
          description: Explicit acceptance or rejection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromptSuggestion" }
  /airank/v1/projects/{projectId}/monitoring-runs:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listMonitoringRuns
      responses:
        "200":
          description: Owned runs, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MonitoringRun" } }
    post:
      operationId: createMonitoringRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitoringRunInput" }
      responses:
        "202":
          description: Durable idempotent run, may be capacity-blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringRun" }
  /airank/v1/projects/{projectId}/monitoring-runs/{runId}:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: runId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getMonitoringRun
      responses:
        "200":
          description: Incremental actual coverage and immutable observations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringRunDetail" }
  /airank/v1/scans/preview:
    post:
      operationId: previewQuickCheck
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuickCheckInput" }
      responses:
        "200":
          description: Zero-call exact Finnish question preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickCheckPreview" }
  /airank/v1/scans:
    post:
      operationId: submitQuickCheck
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuickCheckSubmission" }
      responses:
        "202":
          description: Atomically queued and linked to owned project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickCheckAccepted" }
  /airank/v1/scans/{scanId}:
    parameters:
      - { name: scanId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getQuickCheck
      responses:
        "200":
          description: Owned immutable evidence with authoritative score
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickCheckReport" }
  /airank/v1/projects/{projectId}/scans:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listProjectQuickChecks
      responses:
        "200":
          description: Durable owned run lookup after refresh or uncertain submission
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QuickCheckAccepted" }
  /airank/v1/app/email/{action}:
    parameters:
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [sign-up, sign-in, verify, reset-request, reset] }
    post:
      operationId: emailAuthenticate
      description: Same-origin JSON email authentication. Sign-up sends a code; verification creates the account. Sign-in and verification rotate the secure session. Password recovery revokes all old sessions. No automatic Google account linking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailAuthInput"
      responses:
        "200":
          description: Authenticated session, opaque email challenge, or completed password reset
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/AppSession" }
                  - type: object
                    required: [challengeId, expiresIn]
                    properties:
                      challengeId: { type: string }
                      expiresIn: { type: integer }
                  - type: object
                    required: [ok]
                    properties:
                      ok: { type: boolean }
        "400": { description: Incorrect or expired code }
        "401": { description: Invalid credentials }
        "403": { description: Invalid origin or request content type }
        "409": { description: Email already belongs to an account; no automatic linking }
        "422": { description: Invalid fields }
        "429": { description: Persistent rate limit reached }
        "503": { description: "Email authentication configuration, mail delivery or hashing capacity unavailable" }
  /airank/v1/app/session:
    get:
      operationId: getAppSession
      responses:
        "200":
          description: Authoritative session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSession" }
  /airank/v1/app/logout:
    post:
      operationId: logoutApp
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppOk" }
  /airank/v1/measurement-context:
    get:
      operationId: getMeasurementContext
      responses:
        "200":
          description: Global market and prompt language catalogue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeasurementContext" }
  /airank/v1/website-profiles/capabilities:
    get:
      operationId: getWebsiteProfileCapabilities
      responses:
        "200":
          description: Whether AI website autofill is enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebsiteProfileCapabilities" }
  /airank/v1/website-profiles:
    post:
      operationId: createWebsiteProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebsiteProfileRequest" }
      responses:
        "202":
          description: Accepted owned website profile job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebsiteProfileJob" }
  /airank/v1/website-profiles/{jobId}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getWebsiteProfile
      responses:
        "200":
          description: Owned website profile job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebsiteProfileJob" }
  /airank/v1/projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Owned projects including archived
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created owned project and immutable identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /airank/v1/projects/{projectId}:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProject
      responses:
        "200":
          description: Owned project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
    patch:
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          description: New identity version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /airank/v1/projects/{projectId}/archive:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    post:
      operationId: archiveProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectRevision" }
      responses:
        "200":
          description: Archived without deleting evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /airank/v1/projects/{projectId}/versions:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listProjectVersions
      responses:
        "200":
          description: Immutable owned identity history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectIdentity" }
  /airank/v1/me/preferences:
    get:
      operationId: getPreferences
      responses:
        "200":
          description: Account preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
    patch:
      operationId: updatePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreferenceUpdate" }
      responses:
        "200":
          description: Saved preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    Brand:
      type: object
      required: [id, name, aliases, domains, status, version]
      properties:
        id: { type: string }
        name: { type: string }
        aliases: { type: array, items: { type: string } }
        domains: { type: array, items: { type: string } }
        status: { type: string, enum: [active, archived] }
        version: { type: integer }
    Candidate:
      type: object
      required: [id, name, evidenceIds, status, brandId]
      properties:
        id: { type: string }
        name: { type: string }
        evidenceIds: { type: array, items: { type: string } }
        status: { type: string, enum: [pending, accepted, dismissed, merged] }
        brandId: { type: [string, "null"] }
        proposedDomains: { type: array, items: { type: string }, description: Unverified domain proposals; explicit user review required before adding to a cohort }
        source: { type: string, enum: [observed_answer, project_context_ai] }
        reviewRequired: { type: boolean }
        identityVersion: { type: integer }
        market: { type: string }
        language: { type: string }
    Source:
      type: object
      required: [url, domain, answers, owned, evidenceIds]
      properties:
        url: { type: string }
        domain: { type: string }
        answers: { type: integer }
        owned: { type: boolean }
        evidenceIds: { type: array, items: { type: string } }
    Research:
      type: object
      required: [version, competitors, candidates, sources, evidence]
      properties:
        version: { type: integer }
        competitors: { type: array, items: { $ref: "#/components/schemas/Brand" } }
        candidates: { type: array, items: { $ref: "#/components/schemas/Candidate" } }
        sources: { type: array, items: { $ref: "#/components/schemas/Source" } }
        evidence: { type: array, items: { $ref: "#/components/schemas/AnalyticsEvidence" } }
    ResearchInput:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [create, update, archive, accept, dismiss, merge, suggest] }
        id: { type: string }
        targetId: { type: string }
        expectedVersion: { type: integer, description: Required for cohort mutations; omitted for suggest }
        name: { type: string }
        aliases: { type: array, items: { type: string } }
        domains: { type: array, items: { type: string } }
    EvidenceDetail:
      type: object
      required: [evidence, raw, rawAvailable]
      properties:
        evidence: { $ref: "#/components/schemas/AnalyticsEvidence" }
        raw: { type: object, additionalProperties: true }
        rawAvailable: { type: boolean }
    SentimentQuote:
      type: object
      required: [text, start, end, polarity]
      properties:
        text: { type: string }
        start: { type: integer }
        end: { type: integer }
        polarity: { type: string }
        score: { type: [number, "null"] }
        attribute: { type: [string, "null"] }
    BrandSentiment:
      type: object
      required: [status]
      properties:
        brandId: { type: [string, "null"] }
        brandName: { type: [string, "null"] }
        status: { type: string }
        label: { type: [string, "null"] }
        score: { type: [number, "null"] }
        quotes: { type: array, items: { $ref: "#/components/schemas/SentimentQuote" } }
        analysisVersion: { type: [string, "null"] }
        rubricVersion: { type: [string, "null"] }
        model: { type: [string, "null"] }
        requestedModel: { type: [string, "null"] }
        assessedAt: { type: [number, "null"] }
    SentimentAnalysis:
      type: object
      required: [state]
      properties:
        state: { type: string }
        analysisVersion: { type: [string, "null"] }
        configuredAnalysisVersion: { type: [string, "null"] }
        requestedModel: { type: [string, "null"] }
        error: { type: [string, "null"] }
    ResultCitation:
      oneOf:
        - { type: string }
        - type: object
          required: [url]
          properties:
            url: { type: string }
            title: { type: string }
    CollectionSource:
      type: object
      required: [url, kind, provenance]
      properties:
        url: { type: string }
        title: { type: string }
        kind: { type: string, enum: [citation, source_reference, retrieval] }
        provenance: { type: string }
        index: { type: integer }
        occurrences: { type: integer }
        passage: { type: string }
        snippet: { type: string }
    CollectionEvidence:
      type: object
      required: [version, supplier, surface, requestedMarket, requestedLanguage, locationVerification, modelVersionVerified, sourceReferences, citationObservation]
      properties:
        version: { type: string }
        retrievalObservation: { type: string, enum: [observed, not_observed, unavailable] }
        supplier: { type: string }
        surface: { type: string }
        requestedMarket: { type: string }
        requestedLanguage: { type: string }
        locationVerification: { type: string }
        reportedLocationCode: { type: [integer, "null"] }
        reportedLanguage: { type: [string, "null"] }
        modelVersionVerified: { type: boolean }
        sourceReferences: { type: array, items: { $ref: "#/components/schemas/CollectionSource" } }
        citationObservation: { type: string }
        searchQueries: { type: [array, "null"], items: {} }
        searchQueryRecords:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/CapturedSearchQuery" }
    EvidenceDiagnostics:
      type: object
      properties:
        measurement_surface: { type: string }
        failure_code: { type: string }
    ResultItem:
      type: object
      required: [id, runId, promptId, text, provider, status, answer, citations]
