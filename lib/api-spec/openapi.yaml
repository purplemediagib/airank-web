        sampleSize: { type: integer }
        score: { type: [number, "null"] }
    SentimentAttribute:
      type: object
      required: [answers, positiveAnswers, negativeAnswers, neutralAnswers, exampleEvidenceIds]
      properties:
        label: { type: string }
        answers: { type: integer }
        positiveAnswers: { type: integer }
        negativeAnswers: { type: integer }
        neutralAnswers: { type: integer }
        exampleEvidenceIds: { type: array, items: { type: string } }
    SentimentMetrics:
